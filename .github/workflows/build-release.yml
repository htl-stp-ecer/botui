name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time: the number is decided at the start of the run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Release number: one more than the highest number that already exists, as a
  # tag v<number>. github.run_number also counts every pull request and
  # every cancelled run, which leaves gaps.
  version:
    name: Release number
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      number: ${{ steps.next.outputs.number }}
    steps:
      - name: Next release number
        id: next
        env:
          PYPI_PACKAGES: ""
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          numbers = []

          tags = subprocess.run(
              ["git", "ls-remote", "--tags", f"https://github.com/{repo}.git"],
              check=True, capture_output=True, text=True,
          ).stdout
          for line in tags.splitlines():
              match = re.search(r"refs/tags/v(\d+)$", line)
              if match:
                  numbers.append(int(match.group(1)))

          # A number that is on PyPI can never be used again, even if the run that
          # uploaded it failed before it created a tag.
          for package in os.environ["PYPI_PACKAGES"].split():
              with urllib.request.urlopen(f"https://pypi.org/pypi/{package}/json") as response:
                  numbers += [int(v) for v in json.load(response)["releases"] if v.isdigit()]

          if not numbers:
              raise SystemExit("no earlier release number found")
          number = max(numbers) + 1
          print(f"next release number: {number}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"number={number}\n")
          PY

  build:
    needs: version
    # A manual run releases too, so only allow it on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"

      - name: Install aarch64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          cache: true

      - name: Cache flutterpi_tool
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-flutterpi-${{ runner.os }}
          restore-keys: pub-cache-flutterpi-

      - name: Install flutterpi_tool
        run: dart pub global activate flutterpi_tool

      - name: Build
        run: BUILD_NUMBER=${{ needs.version.outputs.number }} bash ./build.sh

      - name: Build .deb package
        run: bash ./packaging/build-deb.sh "${{ needs.version.outputs.number }}" build/flutter-pi/pi3-64 stp-velox_${{ needs.version.outputs.number }}_arm64.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.number }}
          name: Release v${{ needs.version.outputs.number }}
          body: |
            Install on the Pi (arm64):

            ```
            sudo apt install ./stp-velox_${{ needs.version.outputs.number }}_arm64.deb
            ```

            This installs the UI to `/home/pi/stp-velox` and enables + starts the
            `flutter-ui` systemd service automatically.
          files: stp-velox_${{ needs.version.outputs.number }}_arm64.deb
